name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run synthetic framework tests
        run: python scripts/smoke_test.py
      - name: Audit release privacy
        run: python scripts/audit_privacy.py
      - name: Validate bundled example
        run: python scripts/validate_config.py assets/launcher-template/dashboard/launcher.config.json
      - name: Compile Python entrypoints
        run: >-
          python -m py_compile
          assets/launcher-template/dashboard/launcher.py
          assets/launcher-template/dashboard/register_project.py
